version: '3.8'

services:
  postgres:
    #image: registry.gitlab-smarttechnics.colruytgroup.com/smart-technics-infra/keycloak/postgres:15
    image: postgres:15
    container_name: keycloak-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: strong_db_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - infra-net

  keycloak:
    #image: registry.gitlab-smarttechnics.colruytgroup.com/smart-technics-infra/keycloak/keycloak:26.0.3
    image: quay.io/keycloak/keycloak:26.0.0
    container_name: keycloak
    command: start-dev #--https-certificate-file=/opt/keycloak/certs/cert.pem --https-certificate-key-file=/opt/keycloak/certs/key.pem
    environment:
      #KC_HOSTNAME: svlipc2l.colruyt.int
      #KC_HOSTNAME_STRICT: false
      KEYCLOAK_BASE_URL: "http://keycloak:8080"
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: strong_db_password
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    restart: unless-stopped
    networks:
      - infra-net
    volumes:
      - ./keycloak/import:/opt/keycloak/data/import
      #- ./keycloak/certs:/opt/keycloak/certs
      - keycloak-data:/opt/keycloak/data

  web:
    #image: python:3.9-slim 
    build: 
      context: .
    image: localhost/flask-oauth:1.2
    container_name: flask-web
    #command: gunicorn --config /app/gunicorn_config.py wsgi:app
    command: ["flask", "run", "--host=0.0.0.0", "--port=5000"]
    restart: unless-stopped
    volumes:
      #- ./FastAPI:/app:z
      #- ./FlaskApp:/app:z
      - ./masupdown:/app:z
      #- ./masupdown/certs/keycloak.pem:/etc/ssl/certs/keycloak.crt:z
    #working_dir: /app
    environment:
      SESSION_FILE_DIR: /app/flask_session
      REQUESTS_CA_BUNDLE: "" #/app/certs/keycloak.sanjay-lab.online.crt
      PYTHONHTTPSVERIFY: 0
      openid_enabled: True
      openid_name: "SSO"
      openid_config_url: "https://sdv-keycloak.mas-haasrode.colruyt.int/realms/sdv-mas/.well-known/openid-configuration"
      openid_secret: "UrfoSE61wr2rRgzgWisL3jkyQNmh2ONa"
      # openid_config_url: "http://192.168.55.93:8080/realms/sanjay-lab/.well-known/openid-configuration"
      # openid_secret: "WlnQrFAQm7oxdX0hl2SwJWc4HtfSj0NV"
      openid_client_id: "flask"
      openid_scope: "openid profile email"
      redirect_uri: "http://localhost:5000/callback"
      #SSL_CERT_FILE: "/app/certs/rootCA.crt"
    # depends_on:
    #   - keycloak
    ports:
      - "5000:5000"
      - "3111:3111"
    networks:
      - infra-net

volumes:
  postgres-data:
  keycloak-data:

networks:
  infra-net:
    driver: bridge