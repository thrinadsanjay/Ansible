events {}
http {
    resolver 10.89.0.1 valid=10s; # Use Docker's internal DNS resolver with short TTL
    # Redirect all HTTP traffic to HTTPS
    server {
        listen 80;
        set $cert_host mas-haasrode.colruyt.int;
        server_name *.$cert_host;
        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        set $cert_host mas-haasrode.colruyt.int;
        server_name *.$cert_host;

        client_max_body_size 10G;
        proxy_read_timeout 3600s;
        proxy_buffering off;
        proxy_request_buffering off;
        # Wildcard SSL certificate configuration
        ssl_certificate /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/server.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # Subdomain routing
        location / {
            proxy_set_header 'Access-Control-Allow-Origin' '*';
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_connect_timeout 5s;
            proxy_read_timeout 10s;
            proxy_send_timeout 10s;

            if ($host = ui.$cert_host) {
                set $upstream "http://mas-ui-name:3000";
                proxy_pass $upstream;
                break;
            }
            if ($host = mongo.$cert_host) {
                set $upstream "http://mongo-express-name:8081";
                proxy_pass $upstream;
                break;
            }
            if ($host = influxdb.$cert_host) {
                set $upstream "http://influxdb:8086";
                proxy_pass $upstream;
                break;
            }
            if ($host = api.$cert_host) {
                set $upstream "http://api-name:8899";
                proxy_pass $upstream;
                break;
            }
            if ($host = grafana.$cert_host) {
                set $upstream "http://grafana:3000";
                proxy_pass $upstream;
                break;
            }
            if ($host = loki.$cert_host) {
                set $upstream "http://loki:3100";
                proxy_pass $upstream;
                break;
            }
            if ($host = registry.$cert_host) {
                set $upstream "http://registry:5000";
                proxy_pass $upstream;
                break;
            }
            if ($host = minio.$cert_host) {
                set $upstream "http://minio:9000";
                proxy_pass $upstream;
                break;
            }
            if ($host = minio-ui.$cert_host) {
                set $upstream "http://minio:9001";
                proxy_pass $upstream;
                break;
            }
            if ($host = deploy.$cert_host) {
                set $upstream "http://initial-setup-suite:5001";
                proxy_pass $upstream;
                break;
            }
            if ($host = wcs.$cert_host) {
                set $upstream "http://wcs:18080";
                proxy_pass $upstream;
                break;
            }
            if ($host = csod.$cert_host) {
                set $upstream "http://csod:9111";
                proxy_pass $upstream;
                break;
            }
            if ($host = sdv-keycloak.$cert_host) {
                set $upstream "http://keycloak:8080";
                proxy_pass $upstream;
                break;
            }
            if ($host = dummy.$cert_host) {
                set $upstream "http://dummy:9001";
                proxy_pass $upstream;
                break;
            }
            error_page 502 = /fallback;
            # Fallback route
            location = /fallback {
                return 503 "Service is currently unavailable. Please try again later.";
            }
        }
    }
}
