---
- name: Print Hello World message
  hosts: "{{ target_hosts }}"
  gather_facts: false

  tasks:
    - name: Display Hello World
      debug:
        msg: "Hello World from Ansible!" #" Version {{semaphore_vars.task_details.target_version}}"
    - name: Display deploy Version
      debug:
        msg: "Deploy Version is {{ semaphore_vars.task_details.incoming_version }}"