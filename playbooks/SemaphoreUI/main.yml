---
- name: Install and configure Semaphore with MariaDB
  hosts: localhost
  become: true
  vars:
    mariadb_root_password: "R0OtPassw0rd"
    mariadb_databases: "semaphore"
    mariadb_user: "semaphore"
    mariadb_password: "S3cr3tPassw0rd"
    mariadb_host: "127.0.0.1"
    semaphore_version: "3.6.10"
    semaphore_install_dir: "/apps/Semaphore"
    semaphore_config_file: "{{ semaphore_install_dir }}/config/config.json"
    semaphore_service_file: "/etc/systemd/system/semaphore.service"
    semaphore_port: 3000
    semaphore_rpm: semaphore_2.15.0_linux_amd64.rpm
    semaphore_repo: "https://github.com/semaphoreui/semaphore/releases/download/v2.15.0/"
    semaphore_admin: admin
    semaphore_admin_password: Admin123
    semaphore_admin_email: svcansible@gmail.com
    semaphore_admin_name: Admin User
  tasks:
    - name: Install required packages
      yum:
        name:
          - epel-release
          - git
          - wget
          - mariadb-server
          - mariadb
          - gcc
          - make
          - go
          - python3-pip
        state: present
      tags: install
    
    - name: Install Pip Libraries for MariaDB
      pip:
        name: 
          - mysql-connector-python
          - PyMySQL
        state: present
      tags: install

    - name: Start and enable MariaDB service
      service:
        name: mariadb
        state: started 
        enabled: true
      tags: mariadb

    # - name: Secure MariaDB installation
    #   mysql_secure_installation:
    #     login_user: root
    #     login_password: ""
    #     root_password: "{{ mariadb_root_password }}"
    #     remove_anonymous_user: true 
    #     disallow_root_login_remotely: true
    #     remove_test_database: true
    #     state: present
    #   tags: mariadb
    #   ignore_errors: true

    - name: Check if root password is set
      mysql_user:
        name: root
        password: "{{ mariadb_root_password }}"
        login_user: root
        login_password: "{{ mariadb_root_password }}"
        state: present
      register: root_password_check
      ignore_errors: true
      tags: mariadb

    - name: Set MariaDB root password
      mysql_user:
        name: root
        host: localhost
        password: "{{ mariadb_root_password }}"
        login_unix_socket: /var/lib/mysql/mysql.sock
        check_implicit_admin: true
        state: present
      when: root_password_check.failed 
      tags: mariadb

    - name: Disable remote root login
      mysql_user:
        name: root
        host: "{{ item }}"
        state: absent
        login_user: root
        login_password: "{{ mariadb_root_password }}"
      loop:
        - "{{ ansible_fqdn }}"
        - "{{ ansible_hostname }}"
        - "%"
      tags: mariadb

    - name: Remove anonymous users
      mysql_user:
        name: ''
        host: "{{ item }}"  
        state: absent
        login_user: root
        login_password: "{{ mariadb_root_password }}"
      loop:
        - localhost
        - "{{ ansible_fqdn }}"
        - "{{ ansible_hostname }}"  
        - "%"
      tags: mariadb

    - name: Remove test database
      mysql_db:
        name: test
        state: absent
        login_user: root
        login_password: "{{ mariadb_root_password }}"
      tags: mariadb

    - name: Create MariaDB database
      mysql_db:
        name: "{{ mariadb_databases }}"
        state: present
        login_user: root
        login_password: "{{ mariadb_root_password }}"
      tags: mariadb

    - name: Create MariaDB user
      mysql_user:
        name: "{{ mariadb_user }}"
        host: "{{ item }}"
        plugin: "mysql_native_password"
        password: "{{ mariadb_password }}"
        priv: "{{ mariadb_databases }}.*:ALL"
        state: present
        login_user: root
        login_password: "{{ mariadb_root_password }}"
      loop:
        - "{{ mariadb_host }}"
      tags: mariadb

    - name: Flush privileges
      community.mysql.mysql_query:
        login_user: root
        login_password: "{{ mariadb_root_password | default('') }}"
        query: "FLUSH PRIVILEGES;"
    
    - name: Verify semaphore DB user can connect
      community.mysql.mysql_query:
        login_user: "{{ mariadb_user }}"
        login_password: "{{ mariadb_password }}"
        login_host: "{{ mariadb_host }}"
        query: "SELECT NOW();"  

    - name: Download and install Semaphore
      block:
        - name: Check if semaphore is already installed
          stat: 
            path: /usr/bin/semaphore
          register: semaphore_binary

        - name: Download Semaphore source code
          get_url:
            url: "{{ semaphore_repo}}{{ semaphore_rpm }}"
            dest: "/tmp/{{ semaphore_rpm }}"
          when: semaphore_binary.stat.exists is false
          tags: semaphore

        - name: Install Semaphore
          yum:
            name: "/tmp/{{ semaphore_rpm }}"
            disable_gpg_check: yes
            state: present
          when: semaphore_binary.stat.exists is false
          tags: semaphore

        - name: Check if semaphore admin user exists
          community.mysql.mysql_query:
            login_user: "{{ mariadb_user }}"
            login_password: "{{ mariadb_password }}"
            login_host: "{{ mariadb_host }}"
            login_db: "{{ mariadb_databases }}"
            query: "SELECT COUNT(*) as count FROM user WHERE username='{{ semaphore_admin }}';"
          register: semaphore_admin_check
          ignore_errors: true

        - name: Debug
          debug:
            var: semaphore_admin_check
          tags: semaphore

        - name: Create Semaphore directories
          file:
            path: "{{ item }}"
            state: directory
            mode: '0755'
          loop:
            - "{{ semaphore_install_dir }}"
            - "{{ semaphore_install_dir }}/playbooks"
            - "{{ semaphore_install_dir }}/config"
            - "{{ semaphore_install_dir }}/logs"
          tags: semaphore

        - name: Create semaphore config.json
          ansible.builtin.copy:
            dest: "{{ semaphore_config_file }}"
            content: |
              {
                "mysql": {
                  "host": "{{ mariadb_host }}:3306",
                  "user": "{{ mariadb_user }}",
                  "pass": "{{ mariadb_password }}",
                  "name": "{{ mariadb_databases }}"
                },
                "dialect": "mysql",
                "tmp_path": "{{ semaphore_install_dir }}/tmp",
                "cookie_hash": "3bf5b8e8358853ca9d23ba9082c1e4c1",
                "cookie_encryption": "4efb36946df90b466279d19dba760f8b",
                "access_key_encryption": "ZOX2Wl0fKOarzo2O+gifMAbEWskFgrbolPg7b8c8O4I="
              }
            mode: '0666'
            owner: "{{ ansible_user_id }}"
            group: "{{ ansible_user_id }}"
          tags: semaphore

        - name: Run semaphore DB migrations
          ansible.builtin.command: >
            semaphore migrate --config {{ semaphore_config_file }}
          args:
            chdir: "{{ semaphore_install_dir }}"
          register: semaphore_migrate
          changed_when: "'Applied' in semaphore_migrate.stdout or 'No change' in semaphore_migrate.stdout"
          tags: semaphore

        - name: Create Semaphore admin user
          ansible.builtin.command: >
            semaphore user add
            --admin
            --login "{{ semaphore_admin }}"
            --name "{{ semaphore_admin_name }}"
            --email "{{ semaphore_admin_email }}"
            --password "{{ semaphore_admin_password }}"
            --config {{ semaphore_config_file }}
          args:
            chdir: "{{ semaphore_install_dir }}"
          register: semaphore_admin_create
          when: semaphore_admin_check.query_result is not defined and semaphore_admin_check.query_result[0][0].count == 0
          changed_when: "'Created' not in semaphore_admin_create.stdout"
          failed_when: semaphore_admin_create.rc != 0 and "'already exists' not in semaphore_admin_create.stderr"
          tags: semaphore

        - name: Ensure port is open in firewall
          ansible.builtin.command: >
            firewall-cmd --add-port={{ semaphore_port }}/tcp --permanent
          register: firewall_cmd
          changed_when: "'success' in firewall_cmd.stdout"
          failed_when: firewall_cmd.rc != 0 and "'already' not in firewall_cmd.stderr"
          tags: semaphore
        
        - name: Create systemd service file for Semaphore
          copy:
            dest: "{{ semaphore_service_file }}"
            content: |
              [Unit]
              Description=Semaphore Service
              After=network.target

              [Service]
              ExecStart=semaphore server --config {{ semaphore_config_file }}
              Restart=always
              User=root
              Group=root
              Environment=PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
              Environment=NODE_ENV=production
              WorkingDirectory={{ semaphore_install_dir }}

              [Install]
              WantedBy=multi-user.target
          notify: 
            - Reload systemd
            - Start Semaphore
      tags: semaphore
  handlers:
    - name: Reload systemd
      command: systemctl daemon-reload
      tags: semaphore
    
    - name: Start Semaphore
      service:
        name: semaphore
        state: started
        enabled: true
      tags: semaphore
