---
- name: Get OS Family
  ansible.builtin.setup:
    gather_subset:
      - 'os_family'
  delegate_to: "{{ VM_NAME }}"
  register: os_info
  become: yes
  tags: configure

- name: Set hostname inside the VM
  hostname:
    name: "{{ VM_NAME }}"
  delegate_to: "{{ VM_NAME }}"
  become: yes
  tags: configure

- name: Assign static IP inside the VM 
  community.general.nmcli:
    conn_name: "{{ vm_interfaces}}"
    ifname: "{{ vm_interfaces}}"
    type: ethernet
    autoconnect: yes
    ip4: "{{ VM_IP }}/{{ SUFFIX }}"
    gw4: "{{ VM_GW }}"
    dns4: 
      - "{{ VM_DNS1 }}"
      - "{{ VM_DNS2 }}"
      - "{{ VM_DNS3 }}"
    state: present
  delegate_to: "{{ VM_NAME }}"
  become: yes
  tags: configure

- name: Restart Network to apply static IP
  ansible.builtin.service:
    name: NetworkManager
    state: restarted
  delegate_to: "{{ VM_NAME }}"
  become: yes
  ignore_errors: yes
  tags: configure

- name: Install FreeIPA client packages on RHEL-based systems
  ansible.builtin.yum:
    name: ipa-client
    state: present
  delegate_to: "{{ VM_NAME }}"
  become: yes
  #when: os_info.ansible_facts.os_family == "RedHat"
  tags: configure
  
- name: Check if VM is already joined to FreeIPA domain
  ansible.builtin.command: ipa-client-show
  delegate_to: "{{ VM_NAME }}"
  become: yes
  register: ipa_check
  ignore_errors: yes
  delegate_to: "{{ VM_NAME }}"
  when: JOIN_IPA_DOMAIN | bool
  tags: configure

- name: Set fact if VM is already joined to FreeIPA domain
  ansible.builtin.set_fact:
    is_joined: "{{ ipa_check.rc == 0 }}"  
  when: JOIN_IPA_DOMAIN | bool
  tags: configure

- name: Join server to FreeIPA domain
  ansible.builtin.command: >
    ipa-client-install 
    --mkhomedir 
    --unattended 
    --domain={{ IPA_DOMAIN }} 
    --server={{ IPA_SERVER }} 
    --realm={{ IPA_REALM }} 
    --principal={{ IPA_ADMIN_USER }} 
    --password={{ IPA_ADMIN_PASSWORD }}
  delegate_to: "{{ VM_NAME }}"
  become: yes
  when: JOIN_IPA_DOMAIN | bool
  tags: configure