---
# tasks file for proxmox_vm_build
- name: Install proxmod python module
  ansible.builtin.pip:
    name: 
    - proxmoxer
    - requests
    - urllib3
    - jmespath
    state: present
  become: yes
  tags: install

- name: List Proxmox VMs
  community.proxmox.proxmox_vm_info:
    api_user : "{{ PROXMOX_USER }}"
    api_token_id : "{{ PROXMOX_TOKEN_ID }}"
    api_token_secret : "{{ PROXMOX_TOKEN_SECRET }}"
    api_host: "{{ PROXMOX_HOST }}"  
    node: "{{ PROXMOX_NODE }}"
    validate_certs: no
    name: "{{ VM_NAME }}"
  register: proxmox_vms
  delegate_to: localhost

- name: Clone VM from template with Cloud Init
  community.proxmox.proxmox_kvm:
    api_user : "{{ PROXMOX_USER }}"
    api_token_id : "{{ PROXMOX_TOKEN_ID }}"
    api_token_secret : "{{ PROXMOX_TOKEN_SECRET }}"
    api_host: "{{ PROXMOX_HOST }}"
    node: "{{ PROXMOX_NODE }}"
    clone: "{{ VM_TEMPLATE }}"
    #vmid: "{{ VM_TEMP_ID }}"
    #newid: "{{ VM_ID }}"
    name: "{{ VM_NAME }}"
    storage: "local-lvm"
    format: "qcow2"
    ciuser: "{{ CI_USER }}"
    cipassword: "{{ CI_PASSWORD }}"
    sshkeys: "{{ SSH_PUB_KEY }}"
    net: 
      net0: "virtio,bridge=vmbr0"
    ipconfig:
      ipconfig0: "ip={{ VM_IP }}/{{ SUFFIX }},gw={{ VM_GW }}"
    nameservers: 
      - "{{ VM_DNS1 }}"
      - "{{ VM_DNS2 }}"
      - "{{ VM_DNS3 }}"
    memory: 2048
    cores: 2
    onboot: yes
    full: yes
    timeout: 300
    state: present
  delegate_to: localhost
  register: clone_result
  when: "'{{VM_NAME}}' not in (proxmox_vms | to_json)"

- name: Wait for 30 seconds for VM to be ready
  ansible.builtin.pause:
    seconds: 30
  when: clone_result is changed
  
  tags: wait
- name: Start VM
  community.proxmox.proxmox_kvm:
    api_user : "{{ PROXMOX_USER }}"
    api_token_id : "{{ PROXMOX_TOKEN_ID }}"
    api_token_secret : "{{ PROXMOX_TOKEN_SECRET }}"
    api_host: "{{ PROXMOX_HOST }}"
    node: "{{ PROXMOX_NODE }}"
    name: "{{ VM_NAME }}"
    state: started
  delegate_to: localhost
  tags: start_vm

- name: Get VM IP info
  community.proxmox.proxmox_vm_info:
    api_user : "{{ PROXMOX_USER }}"
    api_token_id : "{{ PROXMOX_TOKEN_ID }}"
    api_token_secret : "{{ PROXMOX_TOKEN_SECRET }}"
    api_host: "{{ PROXMOX_HOST }}"
    node: "{{ PROXMOX_NODE }}"
    name: "{{ VM_NAME }}"
    network: yes
  register: vm_info
  delegate_to: localhost

- name: Extract Interface names
  set_fact:
    vm_interfaces: >-
      {{ vm_info.proxmox_vms[0].network[1].name}}

- name: Extract IPv4 addresses
  set_fact:
    vm_ipv4_addresses: >-
      {{ vm_info.proxmox_vms[0].network[1]['ip-addresses'] | selectattr('ip-address-type', 'equalto', 'ipv4') | map(attribute='ip-address') | list }}

- name: Display build status message
  ansible.builtin.debug:
    msg: "VM {{ VM_NAME }} has been created and started with IP {{ vm_ipv4_addresses[0] }} on {{ vm_interfaces }}..."
  when: clone_result is changed
  tags: info

- name: Create Dynamic Inventory
  add_host:
    name: "{{ VM_NAME }}"
    ansible_host: "{{ vm_ipv4_addresses[0]}}"
    ansible_user: "{{ ANSIBLE_USER }}"
    ansible_ssh_pass: "{{ ANSIBLE_SSH_PASS }}"