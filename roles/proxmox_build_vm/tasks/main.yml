---
# tasks file for proxmox_vm_build
- name: Install proxmod python module
  ansible.builtin.pip:
    name: 
    - proxmoxer
    - requests
    - urllib3
    state: present
  become: yes
  tags: install

- name: List Proxmox VMs
  community.proxmox.proxmox_vm_info:
    api_user : "{{ PROXMOX_USER }}"
    api_token_id : "{{ PROXMOX_TOKEN_ID }}"
    api_token_secret : "{{ PROXMOX_TOKEN_SECRET }}"
    api_host: "{{ PROXMOX_HOST }}"  
    node: "{{ PROXMOX_NODE }}"
    validate_certs: no
    name: "{{ VM_NAME }}"
  register: proxmox_vms
  delegate_to: localhost

- name: Clone VM from template with Cloud Init
  community.proxmox.proxmox_kvm:
    api_user : "{{ PROXMOX_USER }}"
    api_token_id : "{{ PROXMOX_TOKEN_ID }}"
    api_token_secret : "{{ PROXMOX_TOKEN_SECRET }}"
    api_host: "{{ PROXMOX_HOST }}"
    node: "{{ PROXMOX_NODE }}"
    clone: "{{ VM_TEMPLATE }}"
    #vmid: "{{ VM_TEMP_ID }}"
    #newid: "{{ VM_ID }}"
    name: "{{ VM_NAME }}"
    storage: "local-lvm"
    format: "qcow2"
    ciuser: "{{ CI_USER }}"
    cipassword: "{{ CI_PASSWORD }}"
    sshkeys: "{{ SSH_PUB_KEY }}"
    net: 
      net0: "virtio,bridge=vmbr0"
    ipconfig:
      ipconfig0: "ip={{ VM_IP }}/{{ SUFFIX }},gw={{ VM_GW }}"
    nameservers: 
      - "{{ VM_DNS1 }}"
      - "{{ VM_DNS2 }}"
      - "{{ VM_DNS3 }}"
    memory: 2048
    cores: 2
    onboot: yes
    full: yes
    timeout: 300
    state: present
  delegate_to: localhost
  register: clone_result
  when: "'{{VM_NAME}}' not in (proxmox_vms | to_json)"

- name: Wait for 30 seconds for VM to be ready
  ansible.builtin.pause:
    seconds: 30
  when: clone_result is changed
  
  tags: wait
- name: Start VM
  community.proxmox.proxmox_kvm:
    api_user : "{{ PROXMOX_USER }}"
    api_token_id : "{{ PROXMOX_TOKEN_ID }}"
    api_token_secret : "{{ PROXMOX_TOKEN_SECRET }}"
    api_host: "{{ PROXMOX_HOST }}"
    node: "{{ PROXMOX_NODE }}"
    name: "{{ VM_NAME }}"
    state: started
  delegate_to: localhost
  
  tags: start_vm
